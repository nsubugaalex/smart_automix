# Static analysis settings. Run `flutter analyze` (CI does too).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Catch implicit dynamic casts and missing type information early —
    # important for code that parses stored JSON and MQTT payloads.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - prefer_final_fields
    - unawaited_futures
    - use_build_context_synchronously
