; SMART-AUTOMIX switch panel controller for ESP32.
; Build and flash: pio run -t upload    Serial monitor: pio device monitor

[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    256dpi/MQTT @ ^2.5.2
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    bblanchon/ArduinoJson @ ^7.4.2
