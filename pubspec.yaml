name: smart_automix
description: Small-scale industrial switch panel app for remote machine control and UEDCL-tariff-based electricity cost management in Uganda
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # State management
  flutter_bloc: ^8.1.3
  provider: ^6.1.1

  # Switch-panel hardware link and connectivity
  mqtt_client: ^10.11.1
  connectivity_plus: ^5.0.2

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  intl: ^0.19.0
  flutter_local_notifications: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
