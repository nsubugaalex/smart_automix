name: smart_automix
description: Small-scale industrial switch panel app for remote machine control and UEDCL-tariff-based electricity cost management in Uganda
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (ChangeNotifier services exposed via Provider)
  provider: ^6.1.1

  # Switch-panel hardware link
  mqtt_client: ^10.11.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^11.2.0

  # Operator PIN hashing
  crypto: ^3.0.7

  intl: ^0.20.2
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icon for every platform. Regenerate after changing assets/icon/:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  min_sdk_android: 21
  # Android 8+ crops icons to the launcher's shape; the foreground keeps
  # the ring inside the area every shape shows.
  adaptive_icon_background: "#141B27"
  adaptive_icon_foreground: assets/icon/adaptive_foreground.png
  # The foreground image already has its padding.
  adaptive_icon_foreground_inset: 0
  ios: true
  # iOS rejects transparency and rounds the corners itself.
  image_path_ios: assets/icon/app_icon_ios.png
  remove_alpha_ios: true
  background_color_ios: "#141B27"
  web:
    generate: true
    background_color: "#141B27"
    theme_color: "#141B27"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
