name: smart_automix
description: Small-scale industrial switch panel app for remote machine control and UEDCL-tariff-based electricity cost management in Uganda
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  provider: ^6.1.1
  get: ^4.6.6
  get_it: ^7.6.4

  mqtt_client: ^10.11.1
  http: ^1.1.0
  dio: ^5.3.3
  web_socket_channel: ^2.4.4

  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_storage: ^2.1.1

  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^25.2.7

  intl: ^0.19.0
  crypto: ^3.0.3
  connectivity_plus: ^5.0.2

  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.1

  flutter_local_notifications: ^15.1.0
  workmanager: ^0.5.1
  
  # Performance optimization packages
  flutter_cache_manager: ^3.3.1
  cached_network_image: ^3.3.1
  path_provider: ^2.1.1
  rxdart: ^0.27.7
  quiver: ^3.2.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true