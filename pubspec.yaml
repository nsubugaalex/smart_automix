name: smart_automix
description: Small-scale industrial switch panel app for remote machine control and UEDCL-tariff-based electricity cost management in Uganda
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (ChangeNotifier services exposed via Provider)
  provider: ^6.1.1

  # Switch-panel hardware link
  mqtt_client: ^10.11.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^11.2.0

  # Operator PIN hashing
  crypto: ^3.0.7

  intl: ^0.20.2
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
