name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

  # The app's MQTT link against tool/panel_simulator.dart through a real
  # broker (test/e2e).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Listens on localhost:1883 without authentication by default.
      - name: Start Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          timeout 15 bash -c 'until nc -z localhost 1883; do sleep 0.5; done'

      - name: End-to-end tests
        run: flutter test test/e2e -r expanded
        env:
          MQTT_E2E_HOST: localhost

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/esp32-panel/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      # Builds with panel_config.example.h (no secrets in the repository).
      - name: Build ESP32 firmware
        run: pio run -d firmware/esp32-panel
